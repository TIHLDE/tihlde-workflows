name: "Notify deploy receiver"
on:
  workflow_call:
    inputs:
      deploy_url:
        type: string
        required: false
        default: "https://deploy-king.tihlde.org/deploy"
      image_name:
        type: string
        required: false
        default: ""
        description: "Optional custom image name (repo name by if unset)"
      tag:
        type: string
        required: false
        default: ""
        description: |
          Optional image tag to deploy. Defaults to the short commit SHA that
          _ci_ghcr.yml pushes, so the job must run after a build in the same run.
    secrets:
      DEPLOY_RECEIVER_TOKEN:
        required: true
jobs:
  notify:
    runs-on: ubuntu-latest
    # longer than the 20 minutes of polling in "Wait for deploy result"
    timeout-minutes: 25
    steps:
      - name: Resolve repo slug
        id: repo
        run: echo "slug=${GITHUB_REPOSITORY##*/}" >> $GITHUB_OUTPUT

      - name: Normalize image name
        id: image
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image_name }}" >> $GITHUB_OUTPUT
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          fi

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      - name: Send deploy notification
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_RECEIVER_TOKEN }}
          DEPLOY_URL: ${{ inputs.deploy_url }}
          DEPLOY_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          HTTP_CODE=$(curl -L -s -o /tmp/response.json -w "%{http_code}" \
            -X POST $DEPLOY_URL \
            -H "Content-Type: application/json" \
            -H "x-deploy-token: ${DEPLOY_TOKEN}" \
            -d "{
              \"repo\": \"${{ steps.repo.outputs.slug }}\",
              \"image\": \"${{ steps.image.outputs.image }}\",
              \"tag\": \"${DEPLOY_TAG}\",
              \"deliveryId\": \"${{ github.run_id }}-${{ github.run_attempt }}\"
            }")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Deploy receiver returned HTTP $HTTP_CODE"
            exit 1
          fi
          OK=$(jq -r '.ok' /tmp/response.json 2>/dev/null || echo "false")
          if [ "$OK" != "true" ]; then
            echo "::error::Deploy receiver returned ok=false"
            exit 1
          fi

      - name: Poll for deploy result
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_RECEIVER_TOKEN }}
          DEPLOY_URL: ${{ inputs.deploy_url }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          NOT_FOUND=0
          for _ in $(seq 1 120); do
            sleep 10
            CODE=$(curl -L -s -o /tmp/status.json -w "%{http_code}" \
              -H "x-deploy-token: ${DEPLOY_TOKEN}" \
              "${DEPLOY_URL%/}/${DELIVERY_ID}" || true)

            case "$CODE" in
              200) NOT_FOUND=0 ;;
              404)
                NOT_FOUND=$((NOT_FOUND + 1))
                if [ "$NOT_FOUND" -ge 6 ]; then
                  echo "::error::Receiver no longer knows this deploy, it may have restarted. Result unknown, check the server."
                  exit 1
                fi
                continue ;;
              401)
                echo "::error::Receiver rejected the token when checking status"
                exit 1 ;;
              *)
                # 502, etc. 
                echo "Status check returned HTTP $CODE, retrying"
                continue ;;
            esac

            # .ok only says the lookup worked, the deploy's result is in .job.status
            STATUS=$(jq -r '.job.status // "unknown"' /tmp/status.json 2>/dev/null || echo "unknown")
            STEP=$(jq -r '.job.step // "-"' /tmp/status.json 2>/dev/null || echo "-")
            echo "Status: $STATUS (step: $STEP)"

            case "$STATUS" in
              succeeded)
                exit 0 ;;
              superseded)
                echo "::notice::Replaced by a newer deploy before it started"
                exit 0 ;;
              failed)
                echo "::error::Deploy failed in step $STEP: $(jq -r '.job.error' /tmp/status.json)"
                exit 1 ;;
            esac
          done
          echo "::error::No final deploy status after 20 minutes. Check the server."
          exit 1
