name: "CI: Build and push GHCR image"
on:
  workflow_call:
    inputs:
      context:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      image_name:
        type: string
        required: false
        default: ""
        description: "Optional custom image name (repo name by if unset)"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image_name }}" >> $GITHUB_OUTPUT
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          fi

      - name: Normalize actor name
        id: actor
        run: echo "actor=${GITHUB_ACTOR,,}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value={{sha}}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ steps.actor.outputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
